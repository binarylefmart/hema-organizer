# Publication d'une version : contrôle qualité, construction de l'image et envoi au registre.
#
# Déclenchement :
#   - push d'un tag `vX.Y.Z` (ex. `git tag v0.5.0 && git push origin v0.5.0`)
#   - manuellement (onglet Actions → Release → Run workflow), en saisissant la version
#
# Résultat : <registre>/<espace>/hema-organizer:<version> et :latest — Docker Hub si le dépôt porte
# DOCKERHUB_USERNAME/DOCKERHUB_TOKEN, ghcr.io sinon.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. v0.5.0)"
        required: true
        type: string

# **Portée du GITHUB_TOKEN, fixée ici pour tout le fichier.**
#
# Un job sans bloc `permissions:` hérite des permissions **par défaut du dépôt** — possiblement
# « read and write all » sur un dépôt créé avant que GitHub ne change ce réglage. Or `controles`
# lance `npm ci`, c'est-à-dire les scripts d'installation de toutes les dépendances et de leurs
# dépendances : un paquet compromis y trouverait un jeton capable d'écrire dans le dépôt.
#
# `contents: read` au niveau du workflow devient le plancher de **tous** les jobs, présents et à
# venir ; celui qui a besoin de plus le dit chez lui (`image` ajoute `packages: write`), et un job
# ajouté demain sans bloc `permissions:` est en lecture seule par défaut au lieu d'être en écriture.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hema-organizer
  # Le nom de l'image, sans espace de noms : il est le même partout, seul le registre change.
  IMAGE_COURT: hema-organizer

jobs:
  # ---------------------------------------------------------------------------
  # 1. Contrôles : lint, types, tests unitaires
  # ---------------------------------------------------------------------------
  controles:
    name: Lint, types et tests unitaires
    runs-on: ubuntu-latest
    # Rien d'autre que lire le dépôt : ce job n'écrit ni paquet, ni commentaire, ni release.
    permissions:
      contents: read
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Génération du client Prisma
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

  # ---------------------------------------------------------------------------
  # 2. Image Docker → registre
  # ---------------------------------------------------------------------------
  image:
    name: Construction et publication de l'image
    needs: controles
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Détermination de la version
        id: version
        # La saisie passe par l'environnement, jamais par interpolation directe dans le script :
        # `${{ inputs.version }}` écrit sa valeur **dans** le shell, où une apostrophe bien placée
        # devient du code. Seul un compte ayant le droit d'écriture peut déclencher ce workflow,
        # mais c'est l'anti-motif que GitHub demande explicitement d'éviter.
        env:
          VERSION_SAISIE: ${{ inputs.version }}
          EVENEMENT: ${{ github.event_name }}
        run: |
          if [ "$EVENEMENT" = "workflow_dispatch" ]; then
            VERSION="$VERSION_SAISIE"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          # On retire le « v » de tête : l'étiquette de l'image est 0.5.0, pas v0.5.0.
          VERSION="${VERSION#v}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Version invalide : '$VERSION' (attendu vX.Y.Z)" >&2; exit 1 ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version publiée : ${VERSION}"

      - name: Préparation de Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------------------------
      # Où part l'image
      #
      # **Un seul fichier pour deux dépôts, et c'est le secret qui décide.** Un dépôt qui porte
      # `DOCKERHUB_TOKEN` publie sur Docker Hub, dans l'espace de son compte ; un dépôt qui ne l'a
      # pas publie sur `ghcr.io`, dans l'espace du propriétaire du dépôt, avec le jeton que GitHub
      # fournit tout seul. Aucun des deux ne connaît l'autre, et ajouter le secret suffit à basculer.
      #
      # **Le secret est lu dans un `run`, pas dans un `if`** : le contexte `secrets` n'est pas garanti
      # dans la condition d'une étape, alors qu'il l'est dans l'environnement d'une commande. On en
      # tire un booléen, et les étapes suivantes s'y accrochent.
      #
      # **L'espace de noms ne s'écrit nulle part** : c'est le compte Docker Hub lui-même
      # (`DOCKERHUB_USERNAME`), de sorte qu'un fork qui pose ses propres identifiants publie chez lui
      # sans toucher à ce fichier.
      - name: Destination de l'image
        id: cible
        env:
          DOCKERHUB_PRESENT: ${{ secrets.DOCKERHUB_TOKEN != '' }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${DOCKERHUB_PRESENT}" = "true" ]; then
            if [ -z "${DOCKERHUB_USERNAME}" ]; then
              echo "DOCKERHUB_TOKEN est défini mais pas DOCKERHUB_USERNAME : l'espace de noms manque." >&2
              exit 1
            fi
            DEPOT="docker.io/${DOCKERHUB_USERNAME}/${IMAGE_COURT}"
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            DEPOT="${REGISTRY}/${IMAGE_NAME}"
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "tags<<FIN"
            echo "${DEPOT}:${VERSION}"
            echo "${DEPOT}:latest"
            echo "FIN"
          } >> "$GITHUB_OUTPUT"
          echo "Image publiée sous : ${DEPOT}"

      - name: Connexion à Docker Hub
        if: steps.cible.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Connexion à ghcr.io
        if: steps.cible.outputs.dockerhub != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construction et envoi (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          # La version entre dans l'image : c'est elle que l'écran « À propos » affiche, et rien
          # d'autre ne la connaît une fois le conteneur lancé par `node server.js`.
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.cible.outputs.tags }}
          labels: |
            org.opencontainers.image.title=HEMA Organizer
            org.opencontainers.image.description=Gestion des présences — Mon club d'AMHE
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Récapitulatif
        env:
          TAGS: ${{ steps.cible.outputs.tags }}
        run: |
          {
            echo "### Image publiée"
            echo ""
            printf -- '- `%s`\n' ${TAGS}
            echo ""
            echo "Dans Portainer : **Update the stack** avec *Re-pull image* (la stack suit \`latest\`)."
          } >> "$GITHUB_STEP_SUMMARY"

  # **Les notes de version, en release GitHub.** La section du tag est déjà écrite dans
  # `CHANGELOG.md` (`npm run version:monter`) ; on la publie telle quelle, une fois l'image en ligne
  # — une release qui annoncerait une image encore absente enverrait redéployer pour rien. C'est la
  # page vers laquelle pointe l'encart « Mise à jour disponible » du profil. Seul job en écriture
  # sur le dépôt, et seulement sur un tag poussé : un lancement à la main ne crée aucune release.
  notes:
    name: Notes de version
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Publication de la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # La section `## X.Y.Z`, jusqu'à la suivante. Absente : on le dit, sans faire échouer
          # la publication — l'image, elle, est bien en ligne.
          awk -v v="## ${VERSION}" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then echo "Aucune section ${VERSION} dans CHANGELOG.md." > notes.md; fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "Version ${VERSION}" --notes-file notes.md --verify-tag
          fi

  # ── Déploiement automatique sur Portainer (dépôt du club seulement) ──────────────────────────────
  # Il tourne sur un **runner auto-hébergé** posé sur le serveur du club (étiquette `hema-deploy`) : il
  # va chercher le travail chez GitHub, rien n'est ouvert en entrée, et il parle à Portainer en local.
  # **Garde : la variable de dépôt `PORTAINER_DEPLOY` doit valoir `true`.** Le miroir public reçoit ce
  # fichier tel quel et n'a pas cette variable : le job y est simplement ignoré.
  # Il fait l'équivalent de « Update the stack » + « Re-pull image » (même fichier, mêmes variables),
  # puis attend que le conteneur tourne sur la **nouvelle version** et soit sain. La sauvegarde d'avant
  # migration, elle, est faite par le conteneur au démarrage (docker/entrypoint.sh).
  # Retour en arrière : à la main, comme avant — `APP_TAG` dans Portainer (docs/DEPLOIEMENT.md).
  deploiement:
    name: Déploiement sur Portainer
    needs: image
    if: vars.PORTAINER_DEPLOY == 'true'
    runs-on: [self-hosted, hema-deploy]
    # Lecture seule, et pas moins : le job récupère `scripts/deployer-portainer.sh` dans un dépôt
    # **privé**. Avec `permissions: {}`, le jeton ne pouvait pas lire le dépôt et la récupération
    # échouait (« Repository not found ») — l'image était publiée, rien ne se déployait.
    permissions:
      contents: read
    concurrency:
      group: deploiement-portainer
      cancel-in-progress: false
    env:
      PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
      PORTAINER_TOKEN: ${{ secrets.PORTAINER_TOKEN }}
      STACK_NAME: ${{ vars.PORTAINER_STACK_NAME }}
      STACK_ID: ${{ vars.PORTAINER_STACK_ID }}
      ENDPOINT_ID: ${{ vars.PORTAINER_ENDPOINT_ID }}
      CONTENEUR: ${{ vars.PORTAINER_CONTENEUR || 'hema-organizer' }}
      TLS_INSECURE: ${{ vars.PORTAINER_TLS_INSECURE || 'false' }}
      VERSION_SAISIE: ${{ inputs.version }}
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/deployer-portainer.sh
          sparse-checkout-cone-mode: false

      - name: Redéploiement de la stack et attente de la nouvelle version, saine
        run: |
          VERSION="${VERSION_SAISIE:-$GITHUB_REF_NAME}"
          bash scripts/deployer-portainer.sh "$VERSION"
